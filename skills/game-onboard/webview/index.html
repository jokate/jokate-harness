<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Index</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --card: #ffffff; --raise: #f3f2ee;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
  --ring: rgba(11,11,11,0.10); --shadow: 0 1px 2px rgba(11,11,11,.06), 0 8px 24px rgba(11,11,11,.06);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --seq-0: #e8f1fc; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #5598e7; --seq-4: #2a78d6; --seq-5: #1c5cab; --seq-6: #0d366b;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-ink: #006300;
  --accent: #2a78d6; --code-bg: #f4f3ef; --kw: #7c3aed; --ty: #0f766e; --mac: #c2410c; --str: #a16207; --com: #898781;
  --hero-a: #0b1b3f; --hero-b: #1c3f8f; --hero-c: #3b2a9e;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --card: #161615; --raise: #22221f;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --ring: rgba(255,255,255,0.10); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --seq-0: #13233a; --seq-1: #104281; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #b7d3f6;
    --good-ink: #0ca30c; --accent: #3987e5; --code-bg: #121211; --kw: #c4b5fd; --ty: #5eead4; --mac: #fdba74; --str: #fcd34d; --com: #898781;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --card: #161615; --raise: #22221f;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --ring: rgba(255,255,255,0.10); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --seq-0: #13233a; --seq-1: #104281; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #b7d3f6;
  --good-ink: #0ca30c; --accent: #3987e5; --code-bg: #121211; --kw: #c4b5fd; --ty: #5eead4; --mac: #fdba74; --str: #fcd34d; --com: #898781;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
button, input, select { font: inherit; color: inherit; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
.muted { color: var(--muted); } .ink2 { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; color: #fff; background: linear-gradient(120deg, var(--hero-a), var(--hero-b) 55%, var(--hero-c)); }
.hero::before { content: ""; position: absolute; inset: -40%; background:
  radial-gradient(closest-side, rgba(110,160,255,.35), transparent 70%) 10% 20% / 40% 60% no-repeat,
  radial-gradient(closest-side, rgba(170,120,255,.30), transparent 70%) 85% 10% / 45% 70% no-repeat,
  radial-gradient(closest-side, rgba(40,200,170,.22), transparent 70%) 60% 90% / 40% 60% no-repeat;
  animation: drift 18s ease-in-out infinite alternate; }
.hero::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 28px 28px; mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent); }
@keyframes drift { to { transform: translate(4%, -3%) rotate(6deg); } }
@media (prefers-reduced-motion: reduce) { .hero::before { animation: none; } * { transition: none !important; } }
.hero-in { position: relative; z-index: 1; max-width: 1440px; margin: 0 auto; padding: 22px 16px 18px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.12); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); flex: none; }
.brand h1 { margin: 0; font-size: 20px; letter-spacing: .2px; }
.brand .sub { font-size: 12px; opacity: .8; overflow-wrap: anywhere; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); font-size: 12px; white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #6ee7a8; box-shadow: 0 0 0 3px rgba(110,231,168,.18); }
.pill.off { opacity: .55; } .pill.off .dot { background: #9ca3af; box-shadow: none; }
.hero-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.proj-sel { max-width: 280px; border: 0; background: rgba(255,255,255,.12); color: #fff; border-radius: 8px; padding: 4px 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); font: inherit; font-size: 13px; }
.proj-sel option { color: #111; background: #fff; }
.theme-btn { border: 0; background: rgba(255,255,255,.12); color: #fff; border-radius: 8px; padding: 4px 10px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }

/* ---------- nav + toolbar ---------- */
.nav { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--grid); }
.nav-in { max-width: 1440px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 12px 12px 10px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 1440px; margin: 0 auto; padding: 16px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.field { background: var(--card); border: 1px solid var(--ring); border-radius: 10px; padding: 7px 10px; min-width: 0; }
.field:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
input.field[type=search] { flex: 1 1 240px; }
.btn { border: 1px solid var(--ring); background: var(--card); border-radius: 10px; padding: 7px 12px; cursor: pointer; box-shadow: 0 1px 0 var(--ring); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.view { display: none; } .view.on { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } }

/* ---------- cards & grid ---------- */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.span-12 { grid-column: span 12; } .span-2 { grid-column: span 2; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; } .span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; } .span-3 { grid-column: span 3; }
@media (max-width: 1100px) { .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column: span 12; } .span-3, .span-2 { grid-column: span 6; } }
@media (max-width: 560px) { .span-3 { grid-column: span 12; } }
.card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow), inset 0 0 0 1px var(--ring); padding: 16px; min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 14px; } .card .desc { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.linkish { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; white-space: nowrap; }
.empty { color: var(--muted); padding: 24px 8px; text-align: center; }
.err { color: var(--critical); white-space: pre-wrap; }

/* KPI */
.hero-fig { display: flex; flex-direction: column; justify-content: space-between; min-height: 150px; background: linear-gradient(140deg, color-mix(in srgb, var(--accent) 16%, var(--card)), var(--card) 60%); }
.hero-fig .big { font-size: 56px; font-weight: 650; line-height: 1; letter-spacing: -1px; }
.kpi .label { font-size: 12px; color: var(--ink-2); }
.kpi .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
.kpi .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.status i { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-style: normal; font-size: 11px; }
.status.good i { background: var(--good); } .status.bad i { background: var(--critical); } .status.warn i { background: var(--warning); color: #0b0b0b; } .status.none i { background: var(--axis); }

/* meter */
.meter { height: 10px; border-radius: 999px; background: var(--seq-1); overflow: hidden; }
.meter > b { display: block; height: 100%; background: var(--seq-4); border-radius: 999px; transition: width .6s ease; }

/* chart chrome */
svg text { fill: var(--ink-2); font-size: 11px; }
.axis line, .grid-line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
.chart-table th, .chart-table td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--grid); }
.chart-table td.n { text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; }
.legend i.ring { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--axis); }

/* tooltip */
#tip { position: fixed; z-index: 99; pointer-events: none; background: var(--card); color: var(--ink); border-radius: 10px; box-shadow: var(--shadow), inset 0 0 0 1px var(--ring); padding: 8px 10px; font-size: 12px; max-width: 360px; opacity: 0; transition: opacity .12s; }
#tip .v { font-size: 14px; font-weight: 650; } #tip .k { color: var(--ink-2); } #tip .row { display: flex; align-items: center; gap: 6px; }
#tip .key { width: 12px; height: 2px; border-radius: 1px; display: inline-block; }

/* explore */
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 14px; }
@media (max-width: 960px) { .split { grid-template-columns: minmax(0, 1fr); } }
.results { max-height: 640px; overflow: auto; margin: 0 -8px; }
.res { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 8px; border-radius: 10px; cursor: pointer; }
.res:hover, .res.on { background: var(--raise); }
.res .nm { font-weight: 600; overflow-wrap: anywhere; } .res .nm .sc { color: var(--muted); font-weight: 400; }
.res .loc { grid-column: 2; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2); padding: 1px 8px 1px 6px; border-radius: 999px; background: var(--raise); white-space: nowrap; height: 20px; align-self: start; }
.badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { border: 1px solid var(--ring); background: var(--card); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
.chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.dhead h2 { margin: 0; font-size: 20px; overflow-wrap: anywhere; } .dhead .sc { color: var(--muted); font-weight: 400; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 12px; margin: 10px 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
pre.code { background: var(--code-bg); border-radius: 12px; padding: 10px 0; overflow: auto; max-height: 360px; margin: 10px 0; font-size: 12px; line-height: 1.55; box-shadow: inset 0 0 0 1px var(--ring); }
pre.code .l { display: block; padding: 0 12px; white-space: pre; } pre.code .l:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
pre.code .ln { display: inline-block; width: 3.6em; color: var(--muted); user-select: none; text-align: right; margin-right: 12px; }
.tk-kw { color: var(--kw); } .tk-ty { color: var(--ty); } .tk-mac { color: var(--mac); font-weight: 600; } .tk-str { color: var(--str); } .tk-com { color: var(--com); font-style: italic; }
.rel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
.rel-box { background: var(--raise); border-radius: 12px; padding: 10px; min-width: 0; }
.rel-box h4 { margin: 0 0 6px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.rel-box a { display: block; color: var(--accent); cursor: pointer; text-decoration: none; overflow-wrap: anywhere; padding: 1px 0; }
.reflist { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow: auto; }
.ref { background: var(--raise); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.ref-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; overflow-wrap: anywhere; }
.ref-code { display: block; margin-top: 4px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: pre; overflow-x: auto; color: var(--ink); }

/* graph */
.graph-wrap { position: relative; }
#graph { width: 100%; height: 640px; display: block; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 7%, var(--surface)), var(--surface) 70%); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--ring); touch-action: none; cursor: grab; }
#graph .edge { fill: none; stroke: var(--axis); stroke-width: 1.4; transition: opacity .15s; }
#graph .node circle.body { stroke: var(--surface); stroke-width: 2; transition: r .15s; }
#graph .node text { fill: var(--ink); font-size: 11px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
#graph .node { cursor: pointer; transition: opacity .15s; }
#graph .faded { opacity: .12; }
#graph .band-label { fill: var(--muted); font-size: 11px; font-weight: 600; }
.graph-side { position: absolute; top: 12px; right: 12px; width: min(320px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; }
.graph-tools { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
.gtree { min-height: 320px; max-height: 780px; overflow: auto; padding: 0 16px 14px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--ring); }
.tbar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0 10px; background: var(--surface); border-bottom: 1px solid var(--grid); margin-bottom: 6px; }
.tbar .field { flex: 1 1 220px; min-width: 0; }
.gtree h4 { margin: 12px 0 6px; font-size: 13px; color: var(--ink-2); font-weight: 650; }
.gtree .kids { margin-left: 13px; padding-left: 12px; border-left: 2px solid color-mix(in srgb, var(--axis) 55%, transparent); }
.gtree details > .kids:hover { border-left-color: var(--accent); }
.gtree summary { list-style: none; cursor: pointer; color: var(--ink); } .gtree summary::-webkit-details-marker { display: none; }
.trow { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding: 6px 8px; border-radius: 9px; font-size: 14px; min-width: 0; }
.trow:hover, .trow:focus-visible { background: var(--raise); outline: none; }
.trow.root { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.trow .tw, .grow .tw { width: 16px; flex: none; color: var(--muted); font-size: 10px; text-align: center; transition: transform .15s; }
details[open] > summary .tw.can { transform: rotate(90deg); }
.trow .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--surface); }
.trow .nm { overflow-wrap: anywhere; font-weight: 550; } .trow.root .nm { font-weight: 750; }
.trow .pill, .grow .pill { font-size: 11px; padding: 0 8px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--ring); color: var(--ink-2); white-space: nowrap; }
.trow .mod, .g3-crumb .mod { font-size: 11px; padding: 0 7px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink-2); white-space: nowrap; }
.trow .loc { margin-left: auto; font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--muted); white-space: nowrap; }
.grow { display: flex; align-items: center; gap: 8px; padding: 4px 8px; font-size: 12px; }
.grow .gname { font-weight: 650; color: var(--ink-2); }
.gtree mark { background: color-mix(in srgb, var(--warning) 45%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.gtree .tnone { font-size: 12px; padding: 2px 8px 8px; } .gtree .tnote { font-size: 12px; margin: 14px 6px 0; }
.g3d { position: relative; height: clamp(440px, 74vh, 780px); border-radius: 16px; overflow: hidden; background: radial-gradient(ellipse at 50% 32%, color-mix(in srgb, var(--accent) 11%, var(--surface)), var(--surface) 72%); box-shadow: inset 0 0 0 1px var(--ring); }
.g3d canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
.g3d canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.g3-crumb, .g3-ruler, .g3-help { position: absolute; background: color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter: blur(6px); box-shadow: var(--shadow), inset 0 0 0 1px var(--ring); }
.g3-crumb { left: 12px; top: 12px; max-width: min(760px, calc(100% - 24px)); border-radius: 12px; padding: 8px 10px; font-size: 12px; }
.g3-crumb .path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.g3-crumb .path button { border: 0; background: var(--raise); color: var(--ink); border-radius: 999px; padding: 2px 9px; cursor: pointer; font-size: 12px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g3-crumb .path button.cur { background: var(--accent); color: #fff; font-weight: 650; }
.g3-crumb .sep { color: var(--muted); }
.g3-crumb .info { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; color: var(--ink-2); }
.g3-crumb .info .btn { padding: 2px 9px; font-size: 12px; }
.g3-ruler { left: 12px; top: 50%; transform: translateY(-40%); display: flex; flex-direction: column; gap: 2px; padding: 6px; border-radius: 10px; font-size: 11px; max-height: 50%; overflow: auto; }
.g3-ruler button { border: 0; background: none; color: var(--ink-2); text-align: left; padding: 3px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 11px; }
.g3-ruler button:hover { background: var(--raise); } .g3-ruler button.on { background: var(--accent); color: #fff; font-weight: 650; }
.g3-btns { position: absolute; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 60%; }
.g3-help { left: 12px; bottom: 12px; font-size: 11px; color: var(--muted); padding: 5px 9px; border-radius: 8px; max-width: calc(40% - 24px); }
@media (max-width: 760px) { .g3-ruler, .g3-help { display: none; } .g3-btns { max-width: calc(100% - 24px); } .trow .loc { margin-left: 27px; flex-basis: 100%; } }

/* modules matrix */
.matrix-wrap { overflow: auto; max-height: 760px; }
.matrix-cell { stroke: var(--surface); stroke-width: 2; }
.matrix-cell:hover { stroke: var(--ink); stroke-width: 1.5; }

/* pipeline */
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; }
.anat { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 1100px) { .anat { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .aref { grid-template-columns: minmax(0, 1fr); } .aref .cont { grid-column: 1; } }
.anat-col { background: var(--raise); border-radius: 12px; padding: 12px; min-width: 0; }
.anat-col h4 { margin: 0 0 2px; font-size: 13px; font-family: ui-monospace, Consolas, monospace; }
.anat-col .note { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.afield { padding: 5px 0; border-bottom: 1px solid var(--grid); font-size: 12px; min-width: 0; }
.afield .k { font-family: ui-monospace, Consolas, monospace; color: var(--ink-2); } .afield .v { font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }

  render(b.dataset.v)

function render(tab) {
  if (!SRC && tab !== 'harness') return
  ;({ overview: renderOverview, explore: () => {}, graph: () => {}, modules: renderModules, pipeline: renderPipeline, verify: () => {}, harness: renderHarness })[tab]()
}

// theme
const THEMES = ['auto', 'light', 'dark']

applyTheme()

// ======================================================================= charts
// 가로 막대 (단일 계열, slot 1). rows: [{label, value, note?}]

function lazy(fn) { const d = h('div', { class: 'lazy-chart' }); d._fn = fn; return d }

let _rz = 0; addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(() => layoutCharts(), 150) })

// squarified treemap
function squarify(items, x, y, w, hh) {

  while (rest.length) {

    while (i < rest.length) { const nr = row.concat(rest[i]), nw = ratio(nr, short); if (nw > worst) break; row = nr; worst = nw; i++ }

    const circ = ks.reduce((a, k) => a + 2 * k.rad + T3.GAP, 0), biggest = Math.max(...ks.map(k => k.rad))
    const R = Math.max(circ / (2 * Math.PI), biggest * 1.1, T3.NODE * 2)
    return { R, rad: R + biggest }
  }
  const placeKids = (owner, ks, R, x, y, z, dir, phase) => {
    if (!ks.length) return
    const yy = y + dir * T3.LEVEL
    if (ks.length === 1) { const k = ks[0]; k.ang = null; set(k, x, yy, z); placeKids(k, k.kids, k.R, x, yy, z, dir, phase); return }
    rings.push({ owner, dir, x, y: yy, z, R })
    const circ = ks.reduce((a, k) => a + 2 * k.rad + T3.GAP, 0)
    let a = phase
    for (const k of ks) {
      const span = (2 * k.rad + T3.GAP) / circ * 2 * Math.PI, ang = a + span / 2
      const kx = x + R * Math.cos(ang), kz = z + R * Math.sin(ang)
      k.ang = ang; set(k, kx, yy, kz); placeKids(k, k.kids, k.R, kx, yy, kz, dir, ang)

    }
  }
  const r = m.root
  set(r, 0, 0, 0)
  const su = sizeOf(r.kidsUp), sd = sizeOf(r.kidsDown)
  r.R = Math.max(su.R, sd.R)
  placeKids(r, r.kidsUp, su.R, 0, 0, 0, 1, Math.PI / 2)
  placeKids(r, r.kidsDown, sd.R, 0, 0, 0, -1, Math.PI / 2)
  return rings
}

function stop3d() { if (g3) { g3.alive = false; if (g3.raf) cancelAnimationFrame(g3.raf); if (g3.ro) g3.ro.disconnect() } g3 = null }

function drawTree3D(nodes, edges) {
  stop3d()
  const box = clear($('#g3d')), m = treeModel(nodes, edges), rings = coneLayout(m), list = [...m.all.values()], names = treeNames()
  const canvas = h('canvas', { tabindex: 0, role: 'img', 'aria-label': `3D 트리 — 중심 ${m.root.label}, 노드 ${list.length}개. 화살표로 트리를 따라 이동한다` })
  const crumb = h('div', { class: 'g3-crumb' }), ruler = h('div', { class: 'g3-ruler' }), btns = h('div', { class: 'g3-btns' })
  box.append(canvas, crumb, ruler, btns, h('div', { class: 'g3-help', title: '드래그 = 회전, 휠·핀치 = 확대, 우클릭·Shift+드래그 = 이동, 클릭 = 고르기, 두 번 클릭 = 그 노드를 중심으로 다시 그리기', text: '↑↓←→ 트리 이동 · Enter 코드 · C 중심으로 · ⌫ 뒤로 · F 전체 · 드래그 회전 · 휠 확대' }))
  const s = g3 = { m, rings, list, canvas, ctx: canvas.getContext('2d'), sel: m.root, cross: false, screen: [], anim: null, raf: 0, alive: true, W: 1, H: 1,
    cam: { tx: 0, ty: 0, tz: 0, yaw: 0, pitch: 0.42, dist: 40 } }
  const levels = new Map()   // 'dir|depth' → 노드들 (깊이 자)
  for (const n of list) { const k = `${n.dir}|${n.depth}`; if (!levels.has(k)) levels.set(k, []); levels.get(k).push(n) }

  const resize = () => {
    const dpr = window.devicePixelRatio || 1, r = canvas.getBoundingClientRect()
    s.W = Math.max(1, r.width); s.H = Math.max(1, r.height)
    canvas.width = Math.round(s.W * dpr); canvas.height = Math.round(s.H * dpr)
    s.ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    kick()
  }
  const kick = () => { if (s.alive && !s.raf) s.raf = requestAnimationFrame(loop) }
  const loop = now => { s.raf = 0; if (!s.alive) return; const more = s.anim ? s.anim(now) : false; if (!more) s.anim = null; draw(); if (more) kick() }
  const fly = (to, ms = 700) => {
    const c = s.cam, from = { ...c }
    if (to.yaw !== undefined) { const d = Math.atan2(Math.sin(to.yaw - c.yaw), Math.cos(to.yaw - c.yaw)); to = { ...to, yaw: c.yaw + d } }
    if (REDUCED_MOTION || ms <= 0) { Object.assign(c, to); s.anim = null; kick(); return }
    const t0 = performance.now()
    s.anim = now => {
      let u = Math.min(1, (now - t0) / ms)
      u = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2
      for (const k in to) c[k] = from[k] + (to[k] - from[k]) * u
      return u < 1
    }
    kick()
  }
  const fitView = (nodesIn, ms) => {
    const ns = nodesIn && nodesIn.length ? nodesIn : list
    const xs = ns.map(n => n.x), ys = ns.map(n => n.y), zs = ns.map(n => n.z)
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2, cz = (Math.min(...zs) + Math.max(...zs)) / 2
    const rad = Math.max(4, ...ns.map(n => Math.hypot(n.x - cx, n.y - cy, n.z - cz))) + T3.NODE * 2
    fly({ tx: cx, ty: cy, tz: cz, dist: rad / Math.tan(T3.FOV / 2) * 1.08, pitch: 0.42 }, ms)
  }
  // 고른 노드로 날아간다: 그 노드가 부모 원의 바깥쪽에서 보이도록 돌고, 자식 쪽으로 조금 내려(올려) 자식 원이 같이 들어오게
  const select = (n, how = 'fly') => {
    if (!n) return
    s.sel = n
    if (n.parent) n.parent.lastKid = n
    // 중심은 펼쳐진 쪽으로 대상점을 옮긴다 (아래 갈래만 있으면 아래로)
    const rootShift = (m.root.kidsUp.length ? 1 : 0) - (m.root.kidsDown.length ? 1 : 0)
    const to = { tx: n.x, ty: n.y + (n === m.root ? rootShift * T3.LEVEL * 0.6 : n.dir * T3.LEVEL * 0.35), tz: n.z }
    if (n.ang !== null && n.ang !== undefined) to.yaw = Math.PI / 2 - n.ang
    const span = Math.max(n.R || 0, n.parent ? (n.parent === m.root ? m.root.R : n.parent.R || 0) * 0.55 : 0, 5)
    to.dist = Math.min(220, span * 2.4 + 12)
    to.pitch = n.dir > 0 ? 0.25 : 0.5
    if (how === 'fly') fly(to); else kick()
    hud()
  }
  const above = n => n === m.root ? (n.lastKidUp || m.root.kidsUp[0]) : n.dir > 0 ? (n.lastKid && n.kids.includes(n.lastKid) ? n.lastKid : n.kids[0]) : n.parent
  const below = n => n === m.root ? (n.lastKidDown || m.root.kidsDown[0]) : n.dir < 0 ? (n.lastKid && n.kids.includes(n.lastKid) ? n.lastKid : n.kids[0]) : n.parent
  const siblings = n => n === m.root ? [n] : kidsOf(m, n.parent, n.dir)
  const pathOf = n => { const p = []; for (let x = n; x; x = x.parent) p.unshift(x); return p }
  const subtree = n => { const out = new Set(); const st = [n]; while (st.length) { const x = st.pop(); out.add(x); if (x === m.root) continue; st.push(...x.kids) } return out }
  const recenter = n => {
    if (!n || n === m.root) return
    g3History.push({ focus: $('#gfocus').value, mode: $('#gmode').value })
    $('#gfocus').value = n.label
    drawGraph()
  }
  const back = () => { const h_ = g3History.pop(); if (!h_) return; $('#gmode').value = h_.mode; $('#gfocus').value = h_.focus; drawGraph() }

  function hud() {
    const n = s.sel, path = pathOf(n)
    clear(crumb).append(
      h('div', { class: 'path' }, path.flatMap((x, i) => [i ? h('span', { class: 'sep', text: i === 1 ? (x.dir > 0 ? '↑' : '↓') : '›' }) : null,
        h('button', { class: x === n ? 'cur' : '', title: x.label, text: x.label.length > 30 ? x.label.slice(0, 29) + '…' : x.label, onclick: () => select(x) })])),
      h('div', { class: 'info' },
        h('span', { class: 'badge' }, h('i', { style: { background: kindColor(n.kind) } }), n.kind || '?'),
        n.module ? h('span', { class: 'mod', text: n.module }) : null,
        n.path ? h('span', { class: 'mono', title: `${n.path}:${n.line || ''}`, text: `${baseName(n.path)}${n.line ? ':' + n.line : ''}` }) : null,
        h('span', { class: 'muted', text: n === m.root ? `중심 · 위 ${m.root.kidsUp.length} · 아래 ${m.root.kidsDown.length}` : `${n.dir > 0 ? names[0] : names[1]} ${n.depth}단계 · 하위 ${n.kids.length} · 형제 ${siblings(n).length - 1}` }),
        h('button', { class: 'btn', text: '코드 (Enter)', onclick: () => sideCard(n) }),
        n !== m.root ? h('button', { class: 'btn', text: '중심으로 (C)', onclick: () => recenter(n) }) : null))
    clear(ruler)
    const maxUp = Math.max(0, ...list.filter(x => x.dir > 0).map(x => x.depth)), maxDown = Math.max(0, ...list.filter(x => x.dir < 0).map(x => x.depth))
    const rows = []
    for (let d = maxUp; d >= 1; d--) rows.push([1, d])
    rows.push([0, 0])
    for (let d = 1; d <= maxDown; d++) rows.push([-1, d])
    for (const [dir, d] of rows) {
      const ns = levels.get(`${dir}|${d}`) || []
      const on = n.dir === dir && n.depth === d
      ruler.append(h('button', { class: on ? 'on' : '', text: dir === 0 ? '● 중심' : `${dir > 0 ? '↑' : '↓'}${d} ${dir > 0 ? names[0].split(' (')[0] : names[1].split(' (')[0]} · ${ns.length}`,
        onclick: () => fitView(ns, 700) }))
    }
    clear(btns).append(...[
      h('button', { class: 'btn', text: '전체 (F)', onclick: () => fitView(null, 700) }),
      g3History.length ? h('button', { class: 'btn', text: `뒤로 (⌫) · ${g3History.length}`, onclick: back }) : null,
      m.cross.length ? h('button', { class: 'btn' + (s.cross ? ' primary' : ''), text: `교차 간선 ${m.cross.length}`, onclick: () => { s.cross = !s.cross; hud(); kick() } }) : null,
      h('button', { class: 'btn', text: '2D 트리', onclick: () => { $('#glayout').value = 'tree'; showLayout('tree'); drawTree(gData.nodes, gData.edges) } })].filter(Boolean))
    kick()
  }

  function draw() {
    const { ctx, W, H, cam } = s
    const col = { ink: cssVar('--ink'), muted: cssVar('--muted'), bg: cssVar('--surface'), accent: cssVar('--accent'), axis: cssVar('--axis') }
    ctx.clearRect(0, 0, W, H)
    const f = H / (2 * Math.tan(T3.FOV / 2)), cyw = Math.cos(cam.yaw), syw = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch)
    const proj = (x, y, z) => {
      const dx = x - cam.tx, dy = y - cam.ty, dz = z - cam.tz
      const x1 = dx * cyw - dz * syw, z1 = dx * syw + dz * cyw
      const y2 = dy * cp - z1 * sp, z2 = dy * sp + z1 * cp, d = cam.dist - z2

    }
    const P = new Map()
    for (const n of list) { const p = proj(n.x, n.y, n.z); if (p) P.set(n, p) }
    const ds = [...P.values()].map(p => p.d), dmin = Math.min(...ds), dmax = Math.max(...ds)
    const fog = d => Math.max(0.22, Math.min(1, 1.12 - (d - dmin) / Math.max(1e-6, dmax - dmin) * 0.8))
    const sel = s.sel, path = new Set(pathOf(sel)), sub = subtree(sel), sibs = new Set(siblings(sel))
    const near = x => path.has(x) || sub.has(x) || sibs.has(x)
    // 자식이 놓인 원 (콘의 바닥) — 고른 노드의 형제 원은 강조
    for (const r of rings) {
      const hot = r.owner === sel.parent && r.dir === sel.dir || r.owner === sel && (sel === m.root || r.dir === sel.dir)
      ctx.beginPath()
      let started = false
      for (let i = 0; i <= 64; i++) {
        const a = i / 64 * 2 * Math.PI, p = proj(r.x + r.R * Math.cos(a), r.y, r.z + r.R * Math.sin(a))
        if (!p) { started = false; continue }
        if (!started) { ctx.moveTo(p.x, p.y); started = true } else ctx.lineTo(p.x, p.y)
      }
      const po = P.get(r.owner)
      ctx.globalAlpha = hot ? 0.75 : 0.22 * (po ? fog(po.d) : 0.5)
      ctx.strokeStyle = hot ? col.accent : col.axis
      ctx.lineWidth = hot ? 1.6 : 1
      ctx.stroke()
    }
    // 트리 간선 (부모 → 자식 살), 고른 노드까지의 경로는 굵게
    for (const n of list) {
      if (!n.parent) continue
      const a = P.get(n.parent), b = P.get(n)
      if (!a || !b) continue
      const onPath = path.has(n) && path.has(n.parent)
      ctx.globalAlpha = onPath ? 1 : (near(n) ? 0.7 : 0.3) * fog((a.d + b.d) / 2)
      ctx.strokeStyle = onPath ? col.accent : resolveColor(EDGE_COLORS[n.ekind] || 'var(--axis)')
      ctx.lineWidth = onPath ? 3 : 1.3
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()
    }
    if (s.cross) {
      ctx.setLineDash([4, 4])
      for (const e of m.cross) {
        const a = P.get(m.all.get(e.source)), b = P.get(m.all.get(e.target))
        if (!a || !b) continue
        ctx.globalAlpha = 0.45 * fog((a.d + b.d) / 2); ctx.strokeStyle = col.muted; ctx.lineWidth = 1
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()

      ctx.setLineDash([])
    }
    // 노드: 먼 것부터 (화가 알고리즘)
    const order = [...P.entries()].sort((a, b) => b[1].d - a[1].d)
    s.screen = []
    for (const [n, p] of order) {
      const r = Math.max(2.5, Math.min(30, T3.NODE * 0.5 * p.k * (n === m.root ? 1.5 : 1)))
      const base = resolveColor(kindColor(n.kind))
      ctx.globalAlpha = fog(p.d) * (near(n) ? 1 : 0.55)
      const g = ctx.createRadialGradient(p.x - r * 0.35, p.y - r * 0.35, r * 0.1, p.x, p.y, r)
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, base); g.addColorStop(1, base)
      ctx.fillStyle = g
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 2 * Math.PI); ctx.fill()
      if (n === sel || n === m.root) {
        ctx.globalAlpha = 1; ctx.strokeStyle = n === sel ? col.accent : base; ctx.lineWidth = n === sel ? 3 : 2
        ctx.beginPath(); ctx.arc(p.x, p.y, r + (n === sel ? 5 : 4), 0, 2 * Math.PI); ctx.stroke()
      }
      s.screen.push({ n, x: p.x, y: p.y, r, d: p.d })
    }
    // 이름표: 중요한 것부터 놓고 겹치면 건너뛴다 (고른 노드·경로는 항상)
    const pri = n => n === sel ? 1e9 : path.has(n) ? 1e8 : sub.has(n) && n.parent === sel ? 1e7 : sibs.has(n) ? 1e6 : n === m.root ? 1e6 : (P.get(n) || { k: 0 }).k
    const boxes = [], cand = [...P.keys()].sort((a, b) => pri(b) - pri(a))
    let placed = 0
    for (const n of cand) {
      const p = P.get(n), must = n === sel || path.has(n)
      if (!must && (placed >= 70 || p.k * T3.NODE * 0.5 < 3.2)) continue
      const text = n === sel ? n.label : (n.label.length > 28 ? n.label.slice(0, 27) + '…' : n.label)
      ctx.font = `${n === sel ? 700 : 500} ${n === sel ? 14 : 12}px system-ui, sans-serif`
      const w = ctx.measureText(text).width, r = Math.max(2.5, Math.min(30, T3.NODE * 0.5 * p.k)) + 6
      const tries = [[p.x + r, p.y + 4], [p.x - r - w, p.y + 4], [p.x - w / 2, p.y - r - 4], [p.x - w / 2, p.y + r + 14]]
      let spot = null
      for (const [x, y] of tries) {
        const b = [x - 3, y - 13, x + w + 3, y + 4]
        if (must || !boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1])) { spot = [x, y, b]; break }
      }
      if (!spot) continue
      boxes.push(spot[2]); placed++
      ctx.globalAlpha = must ? 1 : fog(p.d) * (near(n) ? 1 : 0.7)
      ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = col.bg; ctx.strokeText(text, spot[0], spot[1])
      ctx.fillStyle = n === sel ? col.accent : col.ink; ctx.fillText(text, spot[0], spot[1])
    }
    ctx.globalAlpha = 1
  }

  // 입력: 드래그 회전, 우클릭·Shift 드래그 이동, 휠·핀치 확대, 클릭 고르기, 두 번 클릭 = 그 노드를 중심으로 다시
  const ptrs = new Map()
  let drag = null, moved = 0
  const pick = (x, y) => { let best = null; for (const o of s.screen) { const dd = Math.hypot(o.x - x, o.y - y); if (dd <= o.r + 5 && (!best || o.d < best.d)) best = o } return best && best.n }
  canvas.addEventListener('contextmenu', ev => ev.preventDefault())
  canvas.addEventListener('pointerdown', ev => {
    canvas.setPointerCapture(ev.pointerId); ptrs.set(ev.pointerId, [ev.clientX, ev.clientY])
    drag = { x: ev.clientX, y: ev.clientY, pan: ev.button === 2 || ev.shiftKey, pinch: ptrs.size === 2 ? null : undefined }
    moved = 0; s.anim = null
  })
  canvas.addEventListener('pointermove', ev => {
    const r = canvas.getBoundingClientRect()
    if (!drag) {
      const n = pick(ev.clientX - r.left, ev.clientY - r.top)
      canvas.style.cursor = n ? 'pointer' : 'grab'
      if (n) showTip(ev, tipLines(n.label, n === m.root ? '중심' : `${n.dir > 0 ? names[0] : names[1]} ${n.depth}단계`, [['종류', n.kind || '?'], ['모듈', n.module || '-'], ['위치', n.path ? `${baseName(n.path)}:${n.line || ''}` : '-'], ['하위', String(n === m.root ? m.root.kidsUp.length + m.root.kidsDown.length : n.kids.length)]]))
      else hideTip()
      return
    }
    ptrs.set(ev.pointerId, [ev.clientX, ev.clientY])
    const c = s.cam
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1])
      if (drag.pinch) c.dist = Math.max(3, Math.min(600, c.dist * drag.pinch / d))
      drag.pinch = d; moved += 10; kick(); return
    }
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y
    drag.x = ev.clientX; drag.y = ev.clientY; moved += Math.abs(dx) + Math.abs(dy)
    if (drag.pan) {
      // 화면 오른쪽 = (cos yaw, 0, -sin yaw), 화면 위 = (-sin p·sin yaw, cos p, -sin p·cos yaw) — 장면이 손을 따라 움직이게 대상점을 반대로
      const k = c.dist / (s.H / (2 * Math.tan(T3.FOV / 2))), sp = Math.sin(c.pitch), cpi = Math.cos(c.pitch)
      c.tx += (-dx * Math.cos(c.yaw) - dy * sp * Math.sin(c.yaw)) * k
      c.ty += dy * cpi * k
      c.tz += (dx * Math.sin(c.yaw) - dy * sp * Math.cos(c.yaw)) * k
    } else {
      c.yaw += dx * 0.006
      c.pitch = Math.max(-1.45, Math.min(1.45, c.pitch + dy * 0.005))
    }
    hideTip(); kick()
  })
  const end = ev => {
    ptrs.delete(ev.pointerId)
    if (drag && moved < 5 && ptrs.size === 0) {
      const r = canvas.getBoundingClientRect(), n = pick(ev.clientX - r.left, ev.clientY - r.top)
      if (n) select(n)
    }
    if (ptrs.size === 0) drag = null
  }
  canvas.addEventListener('pointerup', end)
  canvas.addEventListener('pointercancel', end)
  canvas.addEventListener('pointerleave', () => { if (!drag) hideTip() })
  canvas.addEventListener('dblclick', ev => { const r = canvas.getBoundingClientRect(), n = pick(ev.clientX - r.left, ev.clientY - r.top); if (n) recenter(n) })
  canvas.addEventListener('wheel', ev => { ev.preventDefault(); s.anim = null; s.cam.dist = Math.max(3, Math.min(600, s.cam.dist * (ev.deltaY > 0 ? 1.12 : 0.89))); kick() }, { passive: false })
  canvas.addEventListener('keydown', ev => {
    const n = s.sel
    const go = {
      ArrowUp: () => { const x = above(n); if (x && n === m.root) m.root.lastKidUp = x; return x },
      ArrowDown: () => { const x = below(n); if (x && n === m.root) m.root.lastKidDown = x; return x },
      ArrowLeft: () => { const sb = siblings(n); return sb[(sb.indexOf(n) - 1 + sb.length) % sb.length] },
      ArrowRight: () => { const sb = siblings(n); return sb[(sb.indexOf(n) + 1) % sb.length] },
      Home: () => m.root,
    }[ev.key]
    if (go) { ev.preventDefault(); const x = go(); if (x && x !== n) select(x); return }
    if (ev.key === 'Enter') { ev.preventDefault(); sideCard(n) }
    else if (ev.key === 'c' || ev.key === 'C') recenter(n)
    else if (ev.key === 'Backspace') { ev.preventDefault(); back() }
    else if (ev.key === 'f' || ev.key === 'F') fitView(null, 700)
  })

function layered(nodes, edges, W, H) {
  // 중심에서 간선 방향(source → target = 위로)으로 층을 매긴다. target 쪽(부모·불리는 쪽)은 위, source 쪽은 아래.
  const layer = new Map(), byId = new Map(nodes.map(n => [n.id, n]))
  const start = nodes.find(n => n.focus) || nodes[0]
  layer.set(start.id, 0); const q = [start.id]
  while (q.length) { const id = q.shift(), l = layer.get(id); for (const e of edges) { if (e.source === id && !layer.has(e.target)) { layer.set(e.target, l - 1); q.push(e.target) } if (e.target === id && !layer.has(e.source)) { layer.set(e.source, l + 1); q.push(e.source) } } }
  nodes.forEach(n => { if (!layer.has(n.id)) layer.set(n.id, 0) })
  const levels = [...new Set(layer.values())].sort((a, b) => a - b)
  const rows = levels.map(l => nodes.filter(n => layer.get(n.id) === l))
  for (let it = 0; it < 4; it++) rows.forEach((row, ri) => { row.forEach(n => { const nb = edges.filter(e => e.source === n.id || e.target === n.id).map(e => byId.get(e.source === n.id ? e.target : e.source)).filter(m => m && m.order !== undefined); n.bary = nb.length ? nb.reduce((a, m) => a + m.order, 0) / nb.length : (n.order || 0) }); row.sort((a, b) => a.bary - b.bary); row.forEach((n, i) => n.order = i - (row.length - 1) / 2) })
  // 한 층이 너무 넓으면 여러 줄로 접는다 (자식 60개를 한 줄에 펴면 읽을 수 없다)
  const perRow = Math.max(4, Math.floor(W / COL_W))
  const bands = []
  rows.forEach((row, ri) => { for (let k = 0; k < row.length; k += perRow) bands.push({ level: levels[ri], nodes: row.slice(k, k + perRow) }) })
  bands.forEach((band, bi) => band.nodes.forEach((n, i) => { n.x = W / 2 + (i - (band.nodes.length - 1) / 2) * COL_W; n.y = H / 2 + (bi - (bands.length - 1) / 2) * BAND_H; n.layer = band.level }))
  // 층마다 세로 범위 (접힌 줄 전부) — 배경 띠와 이름표용
  return levels.map(l => { const ys = nodes.filter(n => n.layer === l).map(n => n.y), xs = nodes.filter(n => n.layer === l).map(n => n.x); return { level: l, y0: Math.min(...ys), y1: Math.max(...ys), x0: Math.min(...xs), x1: Math.max(...xs), count: ys.length } })
}

// 같은 부모로 가는 선이 한 줄로 겹쳐 조직도처럼 읽힌다. 위로 가지 않는 간선(같은 층·역방향)만 곡선으로 남긴다.
function busPath(s, t) {
  if (s.layer === undefined || t.layer === undefined || t.layer >= s.layer) return null
  const gx = s.x - COL_W / 2, ys = s.y - s.r - 14, yt = t.y + BAND_H / 2 - 4
  return `M${s.x},${s.y - s.r} V${ys} H${gx} V${yt} H${t.x} V${t.y + LABEL_DY + 6}`
}

    kpi('샤드', fmt(inc.shards), inc.unity_split ? `묶음에서 푼 파일 ${inc.unity_split}` : '파일마다 하나'))
  return card('span-12', '증분 — 이번 빌드에서 다시 한 일', '칸 하나가 번역 단위(유니티면 묶음) 하나다. 강제 재색인 = clangd 혼자서는 놓치는 경우(헤더를 포함한 다른 TU, 플래그 변경, TU 로 바뀐 파일)를 이 하네스가 샤드를 지워 다시 돌린 것.',
    h('div', {}, wrap, legend([['var(--s2)', '이번에 다시 색인'], ['color-mix(in srgb, var(--s1) 35%, transparent)', '샤드 재사용']]), kp))
}

// clangd 원본 레코드 셋(!Symbol · !Refs · !Relations) 해부. 필드 설명은 llvm-project clangd/index/{Symbol,Ref,Relation}.h 기준
const SYM_FLAGS = [[1, 'IndexedForCodeCompletion'], [2, 'Deprecated'], [4, 'ImplementationDetail'], [8, 'VisibleOutsideFile'], [16, 'HasDocComment']]
const REF_BITS = [['Decl', '선언', 'Decl'], ['Def', '정의', 'Def'], ['Ref', '참조', 'Ref'], ['Spelled', '이름이 그 자리에 쓰임', 'Spel'], ['Call', '호출 가능 심볼의 참조', 'Call']]
const SYM_WHY = {
  ID: '이름이 아니라 이 해시(USR 기반)가 키다. 오버로드·같은 이름을 구분한다.',
  Scope: '네임스페이스·클래스 한정자. 웹뷰는 Scope + Name 으로 한정 이름을 만든다.',
  CanonicalDeclaration: '첫 선언 위치. clangd 는 0 기준 줄·열이고 저장할 때 1 기준으로 바꾼다.',
  Definition: '정의가 있는 TU 를 색인했을 때만 채워진다.',
  Signature: '코드 완성용 정보 — 완성 대상이 아닌 심볼(클래스 멤버 등)은 비어 있다.',
  References: 'clangd-indexer 는 헤더를 처음 연 TU 에서만 심볼을 모아 이 값이 0 또는 1 에 그친다. 참조 수는 !Refs 를 센다.',
}
function anatomyCard() {
  const body = h('div', {}), inp = h('input', { type: 'search', class: 'field', placeholder: '심볼 이름 (비우면 재정의·참조가 많은 메서드를 고른다)', style: { minWidth: '0' } })
  const go = async () => {
    clear(body).append(h('div', { class: 'empty', text: '불러오는 중…' }))
    let a
    try { a = (await api('anatomy', { src: SRC, name: inp.value.trim() })).anatomy } catch (e) { clear(body).append(h('div', { class: 'err', text: e.message })); return }
    clear(body)
    if (!a) { body.append(h('div', { class: 'empty', text: '그 이름의 심볼이 없다' })); return }
    const sym = h('div', { class: 'anat-col' }, h('h4', { text: '--- !Symbol' }), h('p', { class: 'note', text: '심볼마다 한 건. 무엇이·어디에 선언·정의됐나.' }),
      a.symbol.map(([k, v]) => {
        let shown = v
        if (k === 'Flags') { const f = +v; shown = `${v} = ${SYM_FLAGS.filter(([b]) => f & b).map(([, n]) => n).join(' | ') || 'None'}` }
        const why = SYM_WHY[k.split(' ')[0]]
        return h('div', { class: 'afield' }, h('div', { class: 'k', text: k }), h('div', { class: 'v', text: shown }), why ? h('div', { class: 'why', text: why }) : null)
      }))
    const refs = h('div', { class: 'anat-col' }, h('h4', { text: `--- !Refs  (${fmt(a.refs_total)}건 중 ${a.refs.length})` }),
      h('p', { class: 'note', text: '참조 한 건 = 위치 + 종류 비트 + Container(그 참조를 감싼 함수). Container 를 모으면 호출 그래프가 된다.' }),
      h('div', { class: 'chips', style: { margin: '0 0 6px' } }, REF_BITS.map(([b, d, s]) => h('span', { class: 'badge', title: d }, h('span', { class: 'bits' }, h('b', { class: 'on', text: s })), `${b} — ${d}`))),
      a.refs.map(r => h('div', { class: 'aref' },
        h('span', { class: 'bits', title: `Kind ${r.kind}` }, REF_BITS.map(([b, , s]) => h('b', { class: r.bits.includes(b) ? 'on' : '', text: s }))),
        h('span', { class: 'loc', text: `${r.path}:${r.line}:${r.col}` }),
        h('span', { class: 'cont', text: `Container → ${r.container} · Kind ${r.kind}` }))),
      a.refs.length ? null : h('div', { class: 'empty', text: '참조 기록 없음' }))
    const rel = h('div', { class: 'anat-col' }, h('h4', { text: '--- !Relations' }),
      h('p', { class: 'note', text: '주어 —술어→ 목적어. 부모 —BaseOf→ 자식, 부모 메서드 —OverriddenBy→ 재정의한 메서드. 굵은 쪽이 이 심볼.' }),
      a.relations.map(x => h('div', { class: 'arel' }, h('span', { class: x.self_is === 'subject' ? 'self' : '', text: x.subject }), h('span', { class: 'pred', text: x.predicate }), h('span', { text: '→' }), h('span', { class: x.self_is === 'object' ? 'self' : '', text: x.object }))),
      a.relations.length ? null : h('div', { class: 'empty', text: '이 심볼이 들어간 관계 없음' }))
    body.append(h('div', { class: 'muted', style: { fontSize: '12px', margin: '0 0 8px' } }, '표본: ', h('strong', { class: 'mono', text: a.qname }), a.module ? ` · 모듈 ${a.module}` : ''), h('div', { class: 'anat' }, sym, refs, rel))
  }
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go() })
  const c = card('span-12', '인덱스 해부 — clangd 가 심볼 하나에 남기는 레코드', 'clangd-indexer 출력(YAML)의 세 문서 종류를 표본 한 건으로 그대로 보인다. 이 세 가지가 탐색·그래프·모듈 지도의 전부다.',
    h('div', {}, h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '10px' } }, inp, h('button', { class: 'btn', text: '보기', onclick: go })), body))
  go()
  return c
}

// ======================================================================= 검증
function checksCard(span, title, desc, checks) {
  const body = h('div', {}, checks.map(c => {
    const m = /(\d+)\s*\/\s*(\d+)/.exec(String(c.metric))
    return h('div', { style: { padding: '10px 0', borderBottom: '1px solid var(--grid)' } },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', gap: '8px', flexWrap: 'wrap' } }, h('strong', { text: c.name }), statusChip(c.pass)),
      h('div', { class: 'mono ink2', style: { margin: '4px 0' }, text: String(c.metric) }),
      m && +m[2] ? meterEl(+m[1] / +m[2]) : null,
      h('div', { class: 'muted', style: { fontSize: '12px', marginTop: '6px' }, text: c.why || '' }),
      c.samples && c.samples.length ? h('details', {}, h('summary', { text: `표본 ${c.samples.length}` }), h('div', { class: 'mono' }, c.samples.map(x => h('div', { text: x })))) : null)
  }))
  return card(span, title, desc, body)
}
$('#vself').onclick = async () => {
  const box = clear($('#vout'))
  for (const s of INFO.sources.filter(s => s.available && !s.aux)) {
    const holder = h('div', { class: 'card span-6 empty', text: s.label + ' 검사 중…' }); box.append(holder)
    api('checks', { src: s.name }).then(r => holder.replaceWith(checksCard('span-6', s.label, '자체 검사', r.checks))).catch(e => { holder.className = 'card span-6 err'; holder.textContent = e.message })
  }
}
$('#vcmp').onclick = async () => {
  const box = clear($('#vout')); if (!$('#vpair').value) return
  try { const r = await api('compare', { pair: $('#vpair').value }); box.append(checksCard('span-12', '정규식 ↔ clangd 대조', r.note || '', r.checks)) } catch (e) { box.append(h('div', { class: 'card span-12 err', text: e.message })) }
}
$('#vqs').onclick = async () => {
  const box = clear($('#vout'))
  let r
  try { r = await api('queryset') } catch (e) { box.append(h('div', { class: 'card span-12 err', text: e.message })); return }
  const srcs = r.sources || []
  const bins = [['1위', v => v === 1, 'var(--seq-5)'], ['2–5위', v => typeof v === 'number' && v > 1 && v <= 5, 'var(--seq-3)'], ['6–10위', v => typeof v === 'number' && v > 5, 'var(--seq-2)'], ['못 찾음', v => v === null, 'var(--axis)']]
  const chart = lazy(W => { const rowH = 34, lab = Math.min(200, W * .4), svg = h('svg', { viewBox: `0 0 ${W} ${srcs.length * rowH + 10}`, width: W, height: srcs.length * rowH + 10, role: 'img', 'aria-label': '질의 순위 분포' })
  srcs.forEach((s, i) => {
    const vals = (r.results || []).map(x => x.ranks[s]).filter(v => v !== '-' && v !== undefined)
    const label = (INFO.sources.find(x => x.name === s) || {}).label || s
    svg.append(h('text', { x: lab - 8, y: i * rowH + 22, 'text-anchor': 'end', text: label }))
    let x = lab
    for (const [bn, f, col] of bins) {
      const n = vals.filter(f).length, w = vals.length ? (W - lab - 20) * n / vals.length : 0
      if (!w) continue
      const g = h('g', { tabindex: 0 }); g.append(h('rect', { x: x + 1, y: i * rowH + 8, width: Math.max(0, w - 2), height: 20, rx: 3, fill: col }))
      if (w > 36) g.append(h('text', { x: x + w / 2, y: i * rowH + 22, 'text-anchor': 'middle', style: { fill: col.includes('seq-5') || col.includes('seq-3') ? '#fff' : 'var(--ink)' }, text: String(n) }))
      g.addEventListener('pointermove', ev => showTip(ev, tipLines(`${n} / ${vals.length}`, `${label} · ${bn}`))); g.addEventListener('pointerleave', hideTip)
      svg.append(g); x += w
    }
  })
  return svg })
  box.append(card('span-12', '질의 세트 — 순위 분포', r.note || '', h('div', {}, chart, legend(bins.map(b => [b[2], b[0]])), h('div', { class: 'ink2', style: { marginTop: '10px' } }, (r.summary || []).map(sm => h('div', { class: 'mono', text: `${sm.name}: ${sm.metric}` })))),
    tableOf(['질의', '정답', ...srcs], (r.results || []).map(x => [x.query, x.expect, ...srcs.map(s => x.ranks[s] === null ? '없음' : String(x.ranks[s]))]))))
  layoutCharts(box)
}

// ======================================================================= 하네스
const LANES = ['context', 'session_start', 'index', 'skill', 'script', 'stuck', 'handoff', 'mcp']
const LANE_NAMES = { context: '라우팅', session_start: '세션 시작', index: '인덱스', skill: '스킬', script: '조회', stuck: '매몰', handoff: 'HandOff', mcp: 'MCP' }
async function renderHarness() {
  const box = $('#hv')
  let ev
  try { ev = (await api('events', { limit: 3000, session: $('#hsession').value.trim() })).events } catch (e) { clear(box).append(h('div', { class: 'card span-12 err', text: e.message })); return }
  const f = $('#hfilter').value.trim(); if (f) ev = ev.filter(e => e.feature.includes(f))
  clear(box)
  const feats = new Set(ev.map(e => e.feature)), fails = ev.filter(e => !e.ok).length, sessions = new Set(ev.map(e => e.session).filter(Boolean))
  for (const [label, value, note] of [['기록', ev.length, '이벤트 줄'], ['기능', feats.size, '서로 다른 기능 id'], ['실패', fails, fails ? '빨간 ✕ 로 표시' : '없음'], ['세션', sessions.size, '세션 id 가 있는 기록']]) { const v = h('div', { class: 'value' }); box.append(h('div', { class: 'card span-3 kpi' }, h('div', { class: 'label', text: label }), v, h('div', { class: 'note', text: note }))); countUp(v, value) }
  if (!ev.length) { box.append(h('div', { class: 'card span-12 empty', text: '기록 없음 — 하네스 훅이 설치된 세션에서 기능이 동작하면 쌓인다' })); return }
  const t0 = Math.min(...ev.map(e => e.ts)), t1 = Math.max(...ev.map(e => e.ts)), span = Math.max(1000, t1 - t0)
  const timeline = lazy(W => { const lane = 34, lab = 90, H = LANES.length * lane + 30
  const svg = h('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': '하네스 타임라인' })
  LANES.forEach((l, i) => { svg.append(h('text', { x: lab - 8, y: i * lane + lane / 2 + 4, 'text-anchor': 'end', text: LANE_NAMES[l] }), h('line', { class: 'grid-line', x1: lab, x2: W - 10, y1: i * lane + lane / 2, y2: i * lane + lane / 2 })) })
  const ticks = W < 600 ? 2 : 4
  for (let k = 0; k <= ticks; k++) { const x = lab + (W - lab - 20) * k / ticks; svg.append(h('text', { x, y: H - 6, 'text-anchor': k === 0 ? 'start' : k === ticks ? 'end' : 'middle', class: 'num', text: new Date(t0 + span * k / ticks).toLocaleTimeString('ko-KR') })) }
  for (const e of ev.slice(-1500)) {
    const li = Math.max(0, LANES.indexOf(e.feature.split('.')[0])), x = lab + (W - lab - 20) * (e.ts - t0) / span, y = li * lane + lane / 2
    const g = h('g', { tabindex: 0 })
    if (e.ok) g.append(h('circle', { cx: x, cy: y, r: 5, fill: 'var(--s1)', stroke: 'var(--card)', 'stroke-width': 2 }))
    else g.append(h('path', { d: `M${x - 5},${y - 5} L${x + 5},${y + 5} M${x + 5},${y - 5} L${x - 5},${y + 5}`, stroke: 'var(--critical)', 'stroke-width': 2.4, 'stroke-linecap': 'round' }))
    g.append(h('circle', { cx: x, cy: y, r: 12, fill: 'transparent' }))
    g.addEventListener('pointermove', evv => showTip(evv, tipLines(e.feature, e.t, [['결과', e.ok ? '성공' : '실패'], ['내용', e.detail || '–'], ['세션', (e.session || '–').slice(0, 8)]])))
    g.addEventListener('pointerleave', hideTip)
    svg.append(g)
  }
  return svg })
  box.append(card('span-12', '타임라인', '줄 = 하네스 층, 점 = 기능 동작, ✕ = 실패. 점에 올리면 내용.', h('div', {}, timeline, legend([['var(--s1)', '동작'], ['var(--critical)', '실패 (✕ 모양)']]))))
  const counts = {}; for (const e of ev) { const c = counts[e.feature] || (counts[e.feature] = { n: 0, bad: 0, last: '' }); c.n++; c.bad += e.ok ? 0 : 1; c.last = e.t }
  const rows = Object.entries(counts).sort((a, b) => b[1].n - a[1].n)
  box.append(card('span-5', '기능별 횟수', '', lazy(w => hbar(rows.slice(0, 16).map(([k, c]) => ({ label: k, value: c.n, extra: [['실패', String(c.bad)], ['마지막', c.last]] })), { labelW: 190, width: w })), tableOf(['기능', '횟수', '실패', '마지막'], rows.map(([k, c]) => [k, c.n, c.bad, c.last]), [1, 2])))
  box.append(card('span-7', '최근 기록', '', h('div', { style: { maxHeight: '420px', overflow: 'auto' } }, h('table', { class: 'tbl' }, h('tbody', {}, ev.slice(-200).reverse().map(e => h('tr', {}, h('td', { class: 'mono muted', style: { whiteSpace: 'nowrap' }, text: e.t.slice(11) }), h('td', {}, e.ok ? h('span', { class: 'status good' }, h('i', { text: '✓' })) : h('span', { class: 'status bad' }, h('i', { text: '✕' }))), h('td', { class: 'mono', style: { whiteSpace: 'nowrap' }, text: e.feature }), h('td', { class: 'ink2', text: e.detail }))))))))
  layoutCharts(box)
}
setInterval(() => { if (state.tab === 'harness' && $('#hauto').checked) renderHarness() }, 5000)
$('#hfilter').oninput = () => renderHarness(); $('#hsession').onchange = () => renderHarness()

// 프로젝트 바꾸기: 하네스 이벤트 로그에 남은 최근 프로젝트. 고르면 서버가 그 프로젝트로 바뀌고 화면을 다시 읽는다
async function loadProjects() {
  let r
  try { r = await api('projects') } catch (e) { return }
  const sel = $('#proj'), list = r.projects || []
  if (list.length < 2) { sel.hidden = true; return }
  // 이름이 같은 프로젝트가 있으면 상위 폴더 이름을 붙여 가른다
  const dup = n => list.filter(p => p.name === n).length > 1
  const label = p => `${p.name}${dup(p.name) ? ' (' + p.root.split(/[\\/]/).slice(-3, -1).join('/') + ')' : ''}${p.kind ? ' · ' + p.kind : ''}`
  clear(sel).append(...list.map(p => h('option', { value: p.root, selected: p.root === r.current, title: p.root, text: label(p) })))
  sel.hidden = false
  sel.onchange = async () => {
    sel.disabled = true; $('#sub').textContent = `${sel.value} 로 바꾸는 중…`
    try { await api('switch', { root: sel.value }); location.reload() } catch (e) { $('#sub').textContent = e.message; sel.disabled = false }
  }
}
boot().catch(e => { $('#sub').textContent = e.message })
</script>
